# AndroidX and Jetifier
android.useAndroidX=true
android.enableJetifier=true

# Network timeout optimizations for VM environments
systemProp.http.socketTimeout=120000
systemProp.http.connectionTimeout=120000
systemProp.https.socketTimeout=120000
systemProp.https.connectionTimeout=120000

# Gradle performance optimizations
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=false

# JVM optimizations
org.gradle.jvmargs=-Xmx4g -XX:+UseG1GC -XX:MaxGCPauseMillis=100 -XX:+UseStringDeduplication -Dfile.encoding=UTF-8

# VM-specific optimizations
org.gradle.workers.max=2
kotlin.incremental=false
kapt.incremental.apt=false

# Use Android Studio embedded JDK
org.gradle.java.home=/Applications/Android Studio.app/Contents/jbr/Contents/Home
